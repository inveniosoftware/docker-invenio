name: Publish Debian
description: Reusable action to publish the Debian Docker image to GitHub Container Registry

inputs:
  docker-tags:
    description: Docker image tags
    required: true
  docker-labels:
    description: Docker image labels
    required: true

runs:
  using: 'composite'
  steps:
    # needed to build multi-platform images
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - run: echo "Publishing Docker images with tags '${{ inputs.docker-tags }}' and labels '${{ inputs.docker-labels }}'"
      shell: bash

    - name: Publish Debian
      uses: docker/build-push-action@v3
      with:
        context: ./debian/
        file: ./debian/Dockerfile
        # support images for Intel and Apple Silicon processors
        platforms: linux/amd64, linux/arm64
        push: true
        tags: ${{ inputs.docker-tags }}
        labels: ${{ inputs.docker-labels }}
