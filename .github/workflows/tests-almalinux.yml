# TODO: Align this test file on tests-debian when the Docker image naming scheme is established
#       and almalinux image is updated to follow it.
on:
  pull_request:
    branches:
      - master
    paths:
      - 'almalinux/**'
      - 'tests/**'
      - '.github/workflows/*-almalinux*.yml'

  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '0 3 * * 6'

  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason'
        required: false
        default: 'Manual trigger'

jobs:
  Tests:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        include:
          - image-name: almalinux
            python-version: 3.9
            cmd-args: -t inveniosoftware/almalinux ./almalinux/ --build-arg LINUX_VERSION=9 --build-arg BUILDPLATFORM=linux/amd64
            experimental: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker build
        run: docker build ${{ matrix.cmd-args }}

      - name: Run tests
        run: |
          docker run --name invenio-container --tty --detach inveniosoftware/${{ matrix.image-name }}
          docker cp ./tests/test_image_python.sh invenio-container:/home
          docker exec invenio-container chmod 777 /home/test_image_python.sh
          docker exec invenio-container /home/test_image_python.sh ${{ matrix.python-version }}
          docker cp invenio-container:/tmp/tests_output.txt .
          ./tests/assert_image_tests_passed.sh
